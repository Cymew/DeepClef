# Build DeepClef (Minecraft 26.3, Fabric).
#
# Gradle 8.14 must itself run on Java 21 (it does not support running on Java 25),
# while compilation needs a Java 25 toolchain because MC 26.3 targets Java 25.

name: Java CI with Gradle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (toolchain, required by Minecraft 26.3)
        id: jdk25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up JDK 21 (Gradle runtime)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Register the JDK 25 toolchain for Gradle
        run: |
          set -eux
          # Find the Temurin JDK 25 installation no matter how the action named its env vars.
          JAVA25="$(ls -d "$RUNNER_TOOL_CACHE"/Java_Temurin-Hotspot_jdk/25*/x64 2>/dev/null | head -n 1 || true)"
          if [ -z "$JAVA25" ]; then JAVA25="${JAVA_HOME_25_X64:-}"; fi
          if [ -z "$JAVA25" ]; then
            echo "::error::Could not locate the JDK 25 installation"
            exit 1
          fi
          echo "Using JDK 25 toolchain: $JAVA25"
          "$JAVA25/bin/java" -version
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.paths=$JAVA25" >> "$HOME/.gradle/gradle.properties"
          cat "$HOME/.gradle/gradle.properties"
          echo "Gradle runtime: $(java -version 2>&1 | head -n 1)"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --stacktrace --no-daemon

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: ./build/libs
