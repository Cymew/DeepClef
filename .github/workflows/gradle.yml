# Build DeepClef (Minecraft 26.3, Fabric).
#
# Gradle 8.14 itself must run on Java 21 (it does not support Java 25 yet),
# while compilation needs a Java 25 toolchain because MC 26.3 targets Java 25.

name: Java CI with Gradle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (toolchain, required by Minecraft 26.3)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up JDK 21 (Gradle runtime)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Point Gradle at the JDK 25 toolchain
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.paths=$JAVA_HOME_25_X64" >> "$HOME/.gradle/gradle.properties"
          cat "$HOME/.gradle/gradle.properties"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: ./build/libs
