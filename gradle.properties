# Gradle performance improvements
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.warning.mode=all

# Machine-specific settings (custom JDK locations, local proxies) belong in the
# USER-LEVEL gradle.properties (e.g. $GRADLE_USER_HOME/gradle.properties or
# ~/.gradle/gradle.properties), never in this repository.

# Minecraft / Fabric Properties
# MC 26.3 is unobfuscated; no mappings needed (Unimined handles this).
minecraft_version=26.3
loader_version=0.19.5

# Mod Properties
mod_version=26.3-beta3
maven_group=cymew.deepclef
archives_base_name=deepclef

# Toolchain
java_version=25
